name: Publish to NPM

on:
  push:
    branches:
      - release

permissions:
  id-token: write
  contents: write

jobs:
  publish-package:
    name: Publish all packages to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install npm packages
        run: npm install --ignore-scripts

      - name: Publish Package
        run: npm publish --no-provance --workspaces --tag rc

