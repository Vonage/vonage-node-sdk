---
name: Lint and Test

on:
  - push
  - pull_request

permissions: read-all

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: Test and build
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-slim, windows-latest]
        node: [22.x, 24.x, 26.x]
    steps:
      - name: Checkout code for ${{ matrix.node }}
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

        # We have to install on all versions of node to ensure packages will
        # support those versions
      - name: Install packages
        run: npm install --ignore-scripts --no-audit

      - parallel:
          # We only want to audit third-party packages that will be puslished
          # So we exclude auditing dev packages
        - name: Audit packages
          run: npm audit --omit=dev --workspaces

        - name: Unit testing
          env:
            NODE_OPTIONS: "--max_old_space_size=4096"
            JEST_JUNIT_CLASSNAME: "{filepath}"
          run: npm run test -- --coverage --reporters=jest-junit

        - name: Checking typescript building
          run: npm run build --workspaces

        - name: Linting code
          run: npm run lint --workspaces

      - name: Checking Node module support
        run: npm run check:pkg --workspaces

