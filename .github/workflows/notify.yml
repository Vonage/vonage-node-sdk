name: Notify Release

on:
  workflow_run:
    workflows:
      - Publish to NPM
    types:
      - completed

permissions:
  contents: read

jobs:
  notify-release:
    name: Notify Release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        url:
          - SLACK_WEBHOOK_ASK_DEVREL_URL
          - SLACK_WEBHOOK_DEVREL_TOOLING_URL
          - SLACK_WEBHOOK_DEVREL_PRIVATE_URL
    steps:
      - name: Retrieve release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --url "https://api.github.com/repos/$REPOSITORY/releases?per_page=100" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > releases.json

          node --input-type=module <<'EOF'
          import { appendFile, readFile, writeFile } from 'node:fs/promises';

          const releases = JSON.parse(await readFile('releases.json', 'utf8'));
          const release = releases.find(({ target_commitish }) => (
            target_commitish === process.env.HEAD_SHA
          ));

          if (!release) {
            console.log(`No release found for workflow commit ${process.env.HEAD_SHA}; skipping notification.`);
            await appendFile(process.env.GITHUB_OUTPUT, 'found=false\n');
            process.exit(0);
          }

          const payload = {
            blocks: [
              {
                type: 'header',
                text: {
                  type: 'plain_text',
                  text: `:initial_external_notification_sent: :NodeJS: Version ${release.name} of the NodeJS SDK has been released`,
                },
              },
              {
                type: 'section',
                text: {
                  type: 'mrkdwn',
                  text: release.body || '',
                },
              },
              {
                type: 'divider',
              },
              {
                type: 'section',
                text: {
                  type: 'mrkdwn',
                  text: `You can view the full change log <${release.html_url}|here>`,
                },
              },
            ],
          };

          await writeFile('slack-payload.json', JSON.stringify(payload));
          await appendFile(process.env.GITHUB_OUTPUT, 'found=true\n');
          EOF

      - name: Send to Slack channels
        if: ${{ steps.release.outputs.found == 'true' }}
        uses: slackapi/slack-github-action@3493f18217f6e55d55ff3ea694dec41304e53e97
        continue-on-error: true
        with:
          webhook: ${{ secrets[matrix.url] }}
          webhook-type: incoming-webhook
          errors: true
          payload-file-path: ./slack-payload.json
